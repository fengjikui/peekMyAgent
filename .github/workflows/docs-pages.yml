name: Documentation Demo Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs-pages.yml
      - assets/demo/**
      - README.md
      - README.zh-CN.md
      - docs/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: documentation-demo-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Prepare static demo site
        env:
          SITE_DIR: ${{ runner.temp }}/pma-demo-pages
        run: |
          mkdir -p "$SITE_DIR/assets"
          cp -R assets/demo "$SITE_DIR/assets/demo"
          cp assets/demo/storyboard/pages-index.html "$SITE_DIR/index.html"
          touch "$SITE_DIR/.nojekyll"

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/pma-demo-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
