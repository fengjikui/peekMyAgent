name: Release Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    if: github.event_name != 'push'
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: npm run release:check:linux
          - os: macos-latest
            command: npm run release:check:macos
          - os: windows-latest
            command: npm run release:check:windows

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - run: ${{ matrix.command }}

  main-integrity:
    if: github.event_name == 'push'
    name: Main merge integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci
      - run: npm run smoke:release-version
      - run: npm run smoke:package
      - run: npm run smoke:release-workflow
      - run: npm run smoke:governance
