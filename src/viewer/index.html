<!doctype html>
<html lang="zh-CN" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>peekMyAgent Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Lucide icon paths, ISC licensed: https://lucide.dev -->
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-sun-moon" viewBox="0 0 24 24">
        <path d="M12 2v2"></path>
        <path d="M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715"></path>
        <path d="M16 12a4 4 0 0 0-4-4"></path>
        <path d="m19 5-1.256 1.256"></path>
        <path d="M20 12h2"></path>
      </symbol>
      <symbol id="icon-funnel" viewBox="0 0 24 24">
        <path d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z"></path>
      </symbol>
      <symbol id="icon-list-end" viewBox="0 0 24 24">
        <path d="M16 5H3"></path>
        <path d="M16 12H3"></path>
        <path d="M9 19H3"></path>
        <path d="m16 16-3 3 3 3"></path>
        <path d="M21 5v12a2 2 0 0 1-2 2h-6"></path>
      </symbol>
      <symbol id="icon-chart-columns" viewBox="0 0 24 24">
        <path d="M5 21v-6"></path>
        <path d="M12 21V3"></path>
        <path d="M19 21V9"></path>
      </symbol>
    </svg>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-identity">
            <div class="brand-mark" aria-hidden="true">p</div>
            <div class="brand-copy">
              <h1>peekMyAgent</h1>
              <p data-i18n="brandSubtitle">本地请求观察器</p>
            </div>
          </div>
          <label class="sidebar-theme-control" title="选择界面主题" data-i18n-title="themeSelectAria">
            <svg class="ui-icon theme-glyph" aria-hidden="true"><use href="#icon-sun-moon"></use></svg>
            <select id="themeSelect" aria-label="选择界面主题" data-i18n-aria-label="themeSelectAria"></select>
            <span class="select-chevron" aria-hidden="true"></span>
          </label>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-title">
            <p class="field-label" data-i18n="sessionsLabel">会话</p>
            <button class="sidebar-inline-button" id="traceImportButton" type="button" data-i18n="importTrace">导入 Trace</button>
            <input id="traceImportInput" class="hidden-file-input" type="file" accept=".gz,.json,.peektrace,.peektrace.json,.peektrace.json.gz,application/gzip,application/json" />
          </div>
          <nav id="sessionNav" class="session-nav" aria-label="会话列表" data-i18n-aria-label="sessionListAria"></nav>
        </div>
      </aside>

      <div class="sidebar-resizer" id="sidebarResizer" role="separator" aria-label="调整会话栏宽度" aria-orientation="vertical" tabindex="0" data-i18n-aria-label="sidebarResizerAria"></div>

      <main class="main-panel">
        <header class="topbar">
          <div class="topbar-inner">
            <div>
              <p class="eyeline" data-i18n="dashboardEyeline">Local dashboard · 请求时间线</p>
              <h2 id="pageTitle" data-i18n="timelineTitle">Agent 请求时间线</h2>
            </div>
            <div class="topbar-actions">
              <section id="traceQuery" class="trace-query"></section>
              <div class="topbar-control-row">
                <div class="language-controls" aria-label="语言设置" data-i18n-aria-label="languageSettingsAria">
                  <label class="language-control">
                    <span data-i18n="uiLanguageLabel">界面</span>
                    <select id="uiLanguageSelect"></select>
                  </label>
                  <label class="language-control">
                    <span data-i18n="translationLanguageLabel">翻译</span>
                    <select id="translationLanguageSelect"></select>
                  </label>
                </div>
                <div id="viewControls" class="view-controls"></div>
                <details class="session-overview-disclosure" id="sessionOverviewDisclosure">
                  <summary class="session-overview-summary" aria-label="打开会话概览" data-i18n-aria-label="sessionOverviewAria">
                    <svg class="ui-icon session-overview-glyph" aria-hidden="true"><use href="#icon-chart-columns"></use></svg>
                    <span class="visually-hidden" data-i18n="sessionOverview">概览</span>
                    <span class="control-tooltip" aria-hidden="true" data-i18n="sessionOverviewAria">打开会话概览</span>
                  </summary>
                  <div class="session-overview-popover">
                    <div id="sessionOverviewActions" class="session-overview-actions"></div>
                    <div id="stats" class="stats" aria-label="会话统计" data-i18n-aria-label="sessionStatsAria"></div>
                  </div>
                </details>
              </div>
            </div>
            <div class="topbar-pane-controls">
              <button class="layout-icon sidebar-toggle" id="toggleSidebar" type="button" title="折叠会话栏" aria-label="切换会话栏" data-i18n-title="toggleSidebarTitle" data-i18n-aria-label="toggleSidebarAria">
                <span class="pane-icon pane-icon-left" aria-hidden="true"></span>
              </button>
              <button class="layout-icon raw-toggle" id="rawToggle" type="button" title="折叠证据详情面板" aria-label="切换证据详情面板" data-i18n-title="toggleRawTitle" data-i18n-aria-label="toggleRawAria">
                <span class="pane-icon pane-icon-right" aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </header>
        <section id="watchSummary" class="watch-summary"></section>
        <section id="timeline" class="timeline"></section>
        <section id="agentComposer" class="agent-composer"></section>
        <nav id="turnRail" class="turn-rail" aria-label="当前会话轮次导航" data-i18n-aria-label="turnRailAria"></nav>
      </main>

      <div class="raw-resizer" id="rawResizer" role="separator" aria-label="调整证据详情面板宽度" aria-orientation="vertical" tabindex="0" data-i18n-aria-label="rawResizerAria"></div>

      <aside class="raw-panel" id="rawPanel">
        <div class="raw-content">
          <div class="raw-header">
            <div>
              <p class="eyeline" data-i18n="evidenceInspectorEyeline">证据详情</p>
              <h2 id="rawTitle" data-i18n="rawTitleEmpty">选择一条请求</h2>
            </div>
          </div>
          <div id="rawTree" class="raw-tree empty" data-i18n="rawEmpty">点击时间线中的“详情”，查看原始证据、整理视图和翻译。</div>
        </div>
      </aside>
    </div>
    <div class="modal-backdrop hidden" id="sessionInfoModal" aria-hidden="true">
      <section class="session-info-modal" role="dialog" aria-modal="true" aria-labelledby="sessionInfoTitle">
        <header class="modal-header">
          <div>
            <p class="eyeline" data-i18n="sessionInfoEyeline">当前会话</p>
            <h2 id="sessionInfoTitle" data-i18n="sessionInfoTitle">会话信息</h2>
          </div>
          <button class="icon-button modal-close" type="button" data-session-info-close aria-label="关闭会话信息" data-i18n-aria-label="closeSessionInfoAria">×</button>
        </header>
        <div id="sessionInfoBody" class="session-info-body"></div>
      </section>
    </div>
    <script type="module" src="/client.js"></script>
  </body>
</html>
